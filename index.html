<!DOCTYPE html>
<html lang="en" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Wazzup Dog</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet"><style id="css">
:root{--bg:#FFF8EC;--card:#fff;--tx:#241A14;--mu:#7B6B5D;--ac:#D7261E;--ac2:#fff;--y:#F9A81C;--bd:#EFE3D0;--dot:rgba(249,168,28,.13);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#16110D;--card:#211A15;--tx:#F6EDE2;--mu:#AC9C8B;--ac:#FF5B4D;--ac2:#16110D;--bd:#3A2F26;--dot:rgba(249,168,28,.07);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#16110D;--card:#211A15;--tx:#F6EDE2;--mu:#AC9C8B;--ac:#FF5B4D;--ac2:#16110D;--bd:#3A2F26;--dot:rgba(249,168,28,.07);color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html{overflow-x:hidden;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 4rem)}
body{margin:0;background:var(--bg) radial-gradient(circle at 2px 2px,var(--dot) 1.5px,transparent 0) 0 0/22px 22px;color:var(--tx);font-family:Cairo,"Segoe UI",Tahoma,sans-serif;line-height:1.5;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
.w{max-width:40rem;margin:0 auto;padding:0 1rem 6rem}
.tools{display:flex;gap:.5rem;align-items:center;padding:.6rem 0}.sp{flex:1}
.ic{min-width:2.5rem;height:2.5rem;border-radius:99px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;font-weight:700;font-size:.9rem;padding:0 .9rem;cursor:pointer}
.hero{text-align:center;padding:.3rem 0 .8rem}.logo{width:9rem;height:auto;display:block;margin:0 auto .3rem}
h1{margin:0;font-size:1.75rem;font-weight:800}.tag{margin:.1rem 0 .6rem;color:var(--mu)}
.acts,.dv{display:flex;flex-wrap:wrap;gap:.5rem;justify-content:center;margin:.5rem 0}
.act{padding:.45rem .9rem;border-radius:99px;background:var(--card);border:1px solid var(--bd);color:var(--tx);text-decoration:none;font-size:.88rem;font-weight:600}
.dvl{width:100%;font-size:.8rem;color:var(--mu)}
.dvs{margin-top:1.6rem}.dp{display:flex;align-items:center;gap:.5rem;padding:.6rem 1.1rem;border-radius:.9rem;background:var(--card);border:1px solid var(--bd);color:var(--tx);font-weight:800;text-decoration:none}.dp i{width:.7rem;height:.7rem;border-radius:50%;background:var(--c,var(--y));display:inline-block}
.srch input{width:100%;padding:.7rem 1rem;border-radius:99px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;margin-top:.4rem}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;gap:.5rem;overflow-x:auto;margin:0 -1rem;padding:.6rem 1rem;background:var(--bg);scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav a{flex:none;padding:.45rem 1rem;border-radius:99px;border:1px solid var(--bd);background:var(--card);color:var(--tx);text-decoration:none;font-size:.9rem;font-weight:600}
nav a.on{background:var(--ac);border-color:var(--ac);color:var(--ac2)}
section{scroll-margin-top:4rem}
h2{font-size:1.25rem;font-weight:800;margin:1.3rem 0 .6rem;padding-bottom:.2rem;border-bottom:3px solid var(--y);display:inline-block}
.it{display:flex;gap:.8rem;align-items:center;background:var(--card);border:1px solid var(--bd);border-radius:1rem;padding:.65rem;margin-bottom:.6rem}
.th{width:6rem;height:4.8rem;object-fit:cover;border-radius:.7rem;flex:none}.tx{flex:1;min-width:0}.tx b{font-size:1rem}.tx p{margin:.1rem 0 0;color:var(--mu);font-size:.82rem}
.pr{white-space:nowrap;text-align:end;color:var(--ac);font-weight:800}.pr s{display:block;color:var(--mu);font-weight:400;font-size:.8rem}.pr small{font-weight:600}
.tap{cursor:pointer;-webkit-tap-highlight-color:transparent}.tap:active{transform:scale(.985)}
.chev{color:var(--mu);font-size:1.5rem;line-height:1}[dir=rtl] .chev{display:inline-block;transform:scaleX(-1)}
.hint{display:inline-block;margin-top:.15rem;font-size:.75rem;font-weight:700;color:var(--ac)}
.bd{display:inline-block;margin-inline-start:.35rem;padding:0 .5rem;border-radius:99px;font-size:.7rem;font-weight:700;vertical-align:middle}
.bd.y{background:var(--y);color:#2b1a00}.bd.r{background:var(--ac);color:var(--ac2)}.bd.g{background:var(--mu);color:var(--bg)}
.sold{opacity:.55}.of{border:2px dashed var(--ac)}
.rail{display:flex;gap:.7rem;overflow-x:auto;padding:.2rem 0 .6rem;scrollbar-width:none}.rail::-webkit-scrollbar{display:none}
.rc{flex:none;width:9.5rem;background:var(--card);border:1px solid var(--bd);border-radius:1rem;overflow:hidden}
.rc img{width:100%;height:6rem;object-fit:cover;display:block}.rc div{padding:.5rem .6rem}.rc b{display:block;font-size:.9rem}.rc .pr{text-align:start;font-size:.9rem}
.bc{background:var(--card);border:1px solid var(--bd);border-radius:1rem;padding:.8rem;margin-bottom:.6rem}.bc p{margin:.15rem 0;font-size:.88rem}
.bt{display:inline-block;padding:.45rem .9rem;border-radius:.7rem;background:var(--ac);color:var(--ac2);text-decoration:none;font-size:.85rem;font-weight:700;margin:.4rem .4rem 0 0;border:1px solid var(--ac)}.bt.g{background:transparent;color:var(--ac)}
.msg{text-align:center;color:var(--mu);font-size:.8rem}
.up{position:fixed;inset-inline-end:1rem;bottom:calc(1rem + env(safe-area-inset-bottom,0px));width:2.8rem;height:2.8rem;border-radius:50%;border:0;background:var(--ac);color:var(--ac2);font-size:1.3rem;opacity:0;pointer-events:none;transition:opacity .2s;z-index:15}.up.on{opacity:1;pointer-events:auto}
#md{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.5);opacity:0;transition:opacity .2s}#md.on{opacity:1}
#md .sh{background:var(--card);color:var(--tx);width:100%;max-width:40rem;max-height:88vh;max-height:88dvh;overflow-y:auto;border-radius:1.4rem 1.4rem 0 0;padding:0 1.1rem calc(1.5rem + env(safe-area-inset-bottom,0px));transform:translateY(2rem);transition:transform .22s}#md.on .sh{transform:none}
#md .cl{position:sticky;top:0;display:flex;justify-content:center;padding:.6rem 0;background:var(--card);z-index:2}
#md .cl button{width:2.6rem;height:2.6rem;padding:0;line-height:1;border-radius:50%;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:1.1rem;cursor:pointer}
#md .big{width:100%;height:15rem;object-fit:contain;background:var(--bg);border-radius:1rem;margin-bottom:.7rem}#md h3{margin:0;font-size:1.4rem}
#md .pp{color:var(--ac);font-weight:800;font-size:1.1rem;margin:.2rem 0}#md h4{margin:1.1rem 0 .5rem;font-size:.85rem;color:var(--mu)}
.chips{display:flex;flex-wrap:wrap;gap:.5rem}.chip{padding:.35rem .8rem;border:1px solid var(--bd);border-radius:99px;background:var(--bg);font-size:.88rem}
/* edit */
details{background:var(--card);border:1px solid var(--bd);border-radius:1rem;margin:.6rem 0;padding:.2rem .8rem}summary{font-weight:800;padding:.7rem 0;cursor:pointer}
.w input:not([type=checkbox]):not([type=file]),.w textarea{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:.6rem;padding:.55rem;width:100%;min-width:0;margin-bottom:.4rem}
.card,.ed{border:1px solid var(--bd);border-radius:.8rem;padding:.6rem;margin:.5rem 0;display:block;background:var(--bg)}
.row2{display:flex;gap:.4rem;flex-wrap:wrap;align-items:center}.row2 input{flex:1}.chks{display:flex;flex-wrap:wrap;gap:.3rem .8rem;margin:.2rem 0 .4rem}
.chk{display:flex;gap:.3rem;align-items:center;font-size:.82rem}.r2{display:flex;gap:.5rem;align-items:center;margin:.3rem 0}.r2 input{min-width:0;max-width:100%}
button{font:inherit;border:0;border-radius:.7rem;padding:.55rem 1rem;background:var(--ac);color:var(--ac2);cursor:pointer}
button.g{background:transparent;color:var(--ac);border:1px solid var(--bd)}button.x{background:transparent;color:#c0392b;border:1px solid #c0392b;white-space:nowrap}
.bar{position:fixed;inset:auto 0 0 0;z-index:40;display:flex;flex-wrap:wrap;gap:.5rem;justify-content:center;padding:.7rem 1rem calc(.7rem + env(safe-area-inset-bottom,0px));background:var(--card);border-top:1px solid var(--bd)}.bar span{width:100%}
