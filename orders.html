 if(d.wa2){const o=rows.find(x=>x.k===d.wa2);if(o)window.open('https://wa.me/'+intl(o.phone)+'?text='+encodeURIComponent(invText(o,lang)),'_blank');return;}
 if(d.pz!==undefined){pmsg='جارٍ التحديث…';draw();try{const u=await setPz(d.pz);pmsg=u?'تم الإيقاف لحد '+new Date(u).toLocaleTimeString('ar',{hour:'2-digit',minute:'2-digit'})+' ✓':'تم فتح الطلبات ✓';}catch(er){pmsg=(er&&er.m)||'فشل التحديث';}draw();return;}
 if(d.a==='pzm'){ov='pz';pmsg='';draw();return;}
 if(d.a==='lang'){lang=lang==='both'?'ar':lang==='ar'?'en':'both';try{localStorage.setItem('olang',JSON.stringify(lang));}catch(_){}draw();return;}
 if(d.a==='snd'){sound=true;beep();wake();draw();return;}if(d.a==='mute'){rows.filter(vis).forEach(o=>unseen.delete(o.k));sv();draw();syncRing();return;}
 if(d.a==='set'){ov='set';draw();return;}if(d.a==='close'){ov='';draw();return;}if(d.a==='all'){all=t.checked;draw();syncRing();return;}
 if(d.a==='save'){const p=parseLink($('#lk').value);if(!p){$('#sm').textContent='ده مش رابط جدول جوجل. انسخه من زرار المشاركة في الجدول.';return;}cfg=Object.assign(cfg,{id:p.id,gid:p.gid,branch:$('#bsel').value,shop:$('#shp').value.trim()||'Wazzup Dog',cc:($('#ccd').value.replace(/\D/g,''))||'973',repo:$('#rpo').value.trim()||cfg.repo,tok:$('#tok').value.trim()});ov='';first=true;rows=[];sv();draw();poll();}});
document.addEventListener('visibilitychange',()=>{if(!document.hidden){wake();poll();}});
draw();setTimeout(poll,0);setInterval(poll,8000);
</script></body></html>
